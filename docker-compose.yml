version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - ML_SERVICE_URL=http://ml-service:8000
      - ML_INTERNAL_API_KEY=${ML_INTERNAL_API_KEY}
    depends_on:
      - ml-service
      - postgres

  ml-service:
    build: ./ml-service
    environment:
      - INTERNAL_API_KEY=${ML_INTERNAL_API_KEY}
    # KHÔNG expose port ra ngoài host, chỉ backend gọi được qua docker network nội bộ
    expose:
      - "8000"

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: